name: (dev) [backend] Deploy to Cloudflare Workers

on:
  push:
    branches:
      - dev
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install project dependencies
        run: npm install

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Update wrangler config with environment variables
        run: |
          jq_filter='.d1_databases[0].database_id = $dbid0
          | .d1_databases[0].database_name = $dbname0
          | .r2_buckets[0].bucket_name = $bucketname
          | .vars.FRONTEND_BASE_URL = $frontendBaseUrl
          | del(.vars.ADMIN_PASSWORD)'

          jq \
            --arg dbid0 "${{ vars.CYBERX_DB_ID }}" \
            --arg dbname0 "${{ vars.CYBERX_DB_NAME }}" \
            --arg bucketname "${{ vars.BUCKET_NAME }}" \
            --arg frontendBaseUrl "${{ vars.FRONTEND_BASE_URL }}" \
            "$jq_filter" \
            wrangler.jsonc > wrangler.local.jsonc

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: wrangler deploy --config wrangler.local.jsonc --name {{ vars.THIS_APP_NAME_BE }}

      - name: Set secrets in Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "${{ secrets.ADMIN_PASSWORD }}" | wrangler secret put ADMIN_PASSWORD --config wrangler.local.jsonc --name {{ vars.THIS_APP_NAME_BE }}
